<!doctype html>
<html lang="en" data-theme="dark-minimal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17191d">
  <meta name="description" content="NEXUS Web is a private workspace stored on this device.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; connect-src 'self' https: http://127.0.0.1:4173 http://localhost:4173; img-src 'self' data: blob: https:; media-src 'self' blob:; frame-src blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%234c68ed'/%3E%3Cpath d='M18 44V20h6l16 16V20h6v24h-6L24 28v16z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="drawing-studio.css">
  <title>NEXUS Web — Private workspace</title>
</head>
<body>
  <div id="app" class="app-shell">
    <aside id="sidebar" class="sidebar">
<a class="brand" href="#home" aria-label="NEXUS Web home"><span class="brand-mark">N</span><span class="brand-name">NEXUS</span><span class="edition">WEB</span></a>
      <button class="workspace-switch" data-action="workspace-switch" aria-label="Switch workspace"><span class="workspace-avatar" id="workspaceAvatar">N</span><span class="workspace-label"><strong id="workspaceName">My Workspace</strong><small>Private · on this device</small></span><span class="chevron">⌄</span></button>
      <nav id="navigation" class="navigation" aria-label="Main navigation">
        <div class="nav-section">Overview</div>
        <button class="nav-item active" data-nav="home"><span class="nav-icon" data-icon="home"></span><span>Home</span></button>
        <button class="nav-item" data-nav="myday"><span class="nav-icon" data-icon="sparkle"></span><span>My Day</span></button>
        <button class="nav-item" data-nav="search"><span class="nav-icon" data-icon="search"></span><span>Search</span></button>
        <div class="nav-section">Workspace</div>
        <button class="nav-item" data-nav="files"><span class="nav-icon" data-icon="files"></span><span>My Files</span></button>
        <button class="nav-item" data-nav="documents"><span class="nav-icon" data-icon="document"></span><span>Documents</span></button>
        <button class="nav-item" data-nav="spreadsheets"><span class="nav-icon" data-icon="sheet"></span><span>Spreadsheets</span></button>
        <button class="nav-item" data-nav="presentations"><span class="nav-icon" data-icon="presentation"></span><span>Presentations</span></button>
        <button class="nav-item" data-nav="drawings"><span class="nav-icon" data-icon="draw"></span><span>Drawings</span></button>
        <button class="nav-item" data-nav="notes"><span class="nav-icon" data-icon="note"></span><span>Notes</span></button>
        <button class="nav-item" data-nav="bookmarks"><span class="nav-icon" data-icon="bookmark"></span><span>Bookmarks</span></button>
        <button class="nav-item" data-nav="collections"><span class="nav-icon" data-icon="collection"></span><span>Collections</span></button>
        <button class="nav-item" data-nav="trash"><span class="nav-icon" data-icon="trash"></span><span>Trash</span></button>
        <div class="nav-section">Plan</div>
        <button class="nav-item" data-nav="calendar"><span class="nav-icon" data-icon="calendar"></span><span>Calendar</span></button>
        <button class="nav-item" data-nav="tasks"><span class="nav-icon" data-icon="tasks"></span><span>Tasks &amp; Reminders</span></button>
        <button class="nav-item" data-nav="agenda"><span class="nav-icon" data-icon="agenda"></span><span>Agenda</span></button>
        <button class="nav-item" data-nav="notifications"><span class="nav-icon" data-icon="bell"></span><span>Notifications</span></button>
        <div class="nav-section">Time</div>
        <button class="nav-item" data-nav="time"><span class="nav-icon" data-icon="clock"></span><span>Time</span></button>
        <div class="nav-section">Connect</div>
        <button class="nav-item" data-nav="email"><span class="nav-icon" data-icon="email"></span><span>Email</span></button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" data-nav="settings"><span class="nav-icon" data-icon="settings"></span><span>Settings</span></button>
        <button class="nav-item" data-nav="privacy"><span class="nav-icon" data-icon="shield"></span><span>Privacy &amp; data</span></button>
        <div class="storage-mini"><div class="storage-row"><span>Browser storage</span><strong id="storageMini">Checking…</strong></div><div class="progress-track"><span id="storageProgress"></span></div><small id="storageCaption">Stored in this browser</small></div>
        <div class="sidebar-foot"><span class="status-dot"></span> Stored locally in this browser</div>
      </div>
    </aside>
    <main class="main-shell">
      <header class="topbar">
        <button id="mobileMenu" class="icon-button mobile-menu" title="Open navigation" aria-label="Open navigation"><span data-icon="menu"></span></button>
        <div class="breadcrumbs"><span class="crumb-muted">Workspace</span><span class="crumb-slash">/</span><strong id="pageLabel">Home</strong></div>
        <div class="top-actions">
          <label class="global-search"><span data-icon="search"></span><input id="globalSearch" type="search" placeholder="Search your workspace" autocomplete="off"><kbd>⌘ K</kbd></label>
          <button class="live-time-pill" data-nav="time" aria-label="Open Time section"><span class="live-time-icon" data-icon="clock"></span><span class="live-time-value" id="globalCurrentTime">--:--:--</span><small id="globalCurrentDate">Today</small></button>
          <button id="notificationButton" class="icon-button notification-button" title="Notifications" aria-label="Notifications"><span data-icon="bell"></span><i id="notificationDot" class="notification-dot hidden"></i></button>
          <button id="installApp" class="button button-quiet install-app-button"><span data-icon="download"></span><span>Install app</span></button>
          <button id="quickAdd" class="button button-primary"><span data-icon="plus"></span><span>New</span></button>
          <button id="profileButton" class="profile-button" title="Workspace settings">N</button>
        </div>
      </header>
      <div id="privacyNotice" class="privacy-notice"><span class="notice-icon" data-icon="shield"></span><span><strong>Your workspace lives in this browser.</strong> Clearing this site’s data can erase it. Make a backup regularly.</span><button id="noticeBackup" class="text-button">Back up now <span data-icon="arrow-right"></span></button><button id="dismissNotice" class="icon-button subtle" aria-label="Dismiss notice"><span data-icon="x"></span></button></div>
      <section id="content" class="content" tabindex="-1"><div class="card"><h1>Opening your workspace</h1><p class="footer-note">Loading local data…</p></div></section>
    </main>
    <nav class="mobile-nav" aria-label="Quick navigation">
      <button data-nav="home"><span data-icon="home"></span><small>Home</small></button>
      <button data-nav="files"><span data-icon="files"></span><small>Files</small></button>
      <button data-nav="search"><span data-icon="search"></span><small>Search</small></button>
      <button data-nav="notes"><span data-icon="note"></span><small>Notes</small></button>
      <button id="mobileMore"><span data-icon="menu"></span><small>More</small></button>
    </nav>
    <button id="mobileShade" class="mobile-shade" aria-label="Close navigation"></button>
    <div id="toastRegion" class="toast-region" aria-live="polite"></div>
    <div id="modalRoot"></div>
    <div id="drawerRoot"></div>
  </div>
  <input id="filePicker" type="file" multiple hidden>
  <input id="importPicker" type="file" accept=".zip,.nexus,.json,application/zip,application/json" hidden>
  <input id="imagePicker" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
  <script src="spreadsheet-engine.js" defer></script>
  <script src="app.js" defer></script>
  <script src="nexus-controls.js" defer></script>
</body>
</html>
